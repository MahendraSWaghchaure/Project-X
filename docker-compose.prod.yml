name: projectx-prod

# Production stack for a single-VM deployment (see DEPLOY.md). Postgres/Redis have no host ports
# published - only the app and caddy containers can reach them, over the compose-internal network.
# Everything reads its secrets from a `.env` file next to this one (see .env.prod.example) - never
# commit a real .env.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-projectx}
      POSTGRES_USER: ${DB_USERNAME:-projectx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - projectx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-projectx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - projectx-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-projectx}
      DB_USERNAME: ${DB_USERNAME:-projectx}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set your deployed frontend's origin in .env}
      TRACKING_INGEST_SECRET: ${TRACKING_INGEST_SECRET:?set a long random string in .env}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@projectx.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set a real password in .env}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@projectx.local}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAYX_PAYOUTS_ENABLED: ${RAZORPAYX_PAYOUTS_ENABLED:-false}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
    volumes:
      - ${JWT_PRIVATE_KEY_PATH:?path to jwt-private.pem in .env}:/run/secrets/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?path to jwt-public.pem in .env}:/run/secrets/jwt-public.pem:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env - see DEPLOY.md for the free sslip.io option if you don't have a real one yet}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - projectx-caddy-data:/data
      - projectx-caddy-config:/config

volumes:
  projectx-postgres-data:
  projectx-redis-data:
  projectx-caddy-data:
  projectx-caddy-config:
