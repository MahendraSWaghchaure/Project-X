spring:
  application:
    name: projectx-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projectx}
    username: ${DB_USERNAME:projectx}
    password: ${DB_PASSWORD:projectx}
    hikari:
      # Spring Boot's own default (10) was sized for a plain request/response app - this one now
      # also has two async executors (notificationExecutor max 16, trackingExecutor max 32, see
      # their respective AsyncConfig classes) doing DB work off the request thread. 25 comfortably
      # covers a realistic mix of Tomcat request threads + async work without the pool approaching
      # Postgres's own default max_connections=100 ceiling, even with headroom for the fact this
      # is one instance today but the number should stay reasonable if that ever changes.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      # Logs a warning (not a failure) if a connection is held longer than this without being
      # returned to the pool - the standard way to catch a leaked/forgotten connection in dev
      # before it becomes pool exhaustion in production.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema - Hibernate only ever validates it matches the entities, never generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        # Hibernate ORM 6+ auto-registers PostGIS spatial types onto the standard PostgreSQL
        # dialect as long as hibernate-spatial is on the classpath - no separate "spatial dialect"
        # class needed (that was a Hibernate 5-era requirement).
        format_sql: false
        # Batches consecutive inserts/updates of the same entity type into fewer round trips -
        # matters most for FeeInvoiceService.ensureInvoicesExistForMonth, which now uses saveAll()
        # across every active child at a school instead of one save() per child.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    # Deliberately no explicit `locations` override - every module's db/migration/*.sql ships
    # inside that module's own jar under the same classpath:db/migration prefix, and Flyway scans
    # across all jars on the classpath for it. Version numbers are partitioned per module (see
    # each module's V*__*.sql header comment) so there's no collision risk.
    # Because each module's range is independent, a later change to an earlier module (e.g. a new
    # module-school migration) can land with a version number lower than one another module already
    # applied - that's expected here, not a real ordering hazard, so out-of-order execution is allowed.
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # Spring Boot's defaults (max 200, min-spare 10) are sized for a generic app; this app's
      # actual request-handling load is bounded by the same free-tier VM's CPU/memory long before
      # 200 concurrent request threads would ever be useful, and a smaller max means faster
      # rejection under real overload instead of every thread queuing behind a starved DB pool.
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}

logging:
  pattern:
    # Appends the request trace id (see common.trace.TraceIdFilter) right after the log level in
    # Spring Boot's default console pattern - "%5p [<traceId>]" - so every line written while
    # handling a request, including from the async executors (MdcTaskDecorator propagates it),
    # can be grepped by the exact id returned in that request's X-Request-Id response header.
    # "-" when there's no trace id (e.g. a scheduled job's own log lines, outside any request).
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Email is best-effort throughout this app (NotificationDispatchService logs SKIPPED_NOT_CONFIGURED
    # rather than failing) - SMTP reachability shouldn't flip the whole app's health to DOWN, especially
    # since spring.mail.host resolving to an empty string in local/dev still activates this indicator.
    mail:
      enabled: false

projectx:
  people:
    qr:
      # Signing key for child boarding-QR tokens - see ChildQrTokenService for the ephemeral-default behavior if unset.
      secret: ${CHILD_QR_SECRET:}

  security:
    jwt:
      # Leave unset in local dev - an ephemeral RSA keypair is generated at startup (see
      # module-identity's JwtKeyConfig). Point these at real PEM files in every other environment.
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  tracking:
    ingest:
      # Required in any environment a real Traccar server points at - see TrackingIngestController.
      shared-secret: ${TRACKING_INGEST_SECRET:}
    delay-monitor:
      interval-ms: 120000
    safety:
      speed-limit-kmh: ${SAFETY_SPEED_LIMIT_KMH:60}
      harsh-braking-delta-kmh: ${SAFETY_BRAKING_DELTA_KMH:25}
      braking-window-seconds: ${SAFETY_BRAKING_WINDOW_SECONDS:15}
      cooldown-seconds: ${SAFETY_COOLDOWN_SECONDS:300}

  notification:
    sms:
      enabled: ${TWILIO_ENABLED:false}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    email:
      enabled: ${SMTP_ENABLED:false}
      from-address: ${SMTP_FROM_ADDRESS:no-reply@projectx.local}

  payment:
    razorpay:
      # Off by default so a fresh dev environment boots without real payment credentials - see
      # RazorpayProperties. Orders/Checkout (parent fees) and Payouts (driver salary) are
      # independent toggles since they need entirely different Razorpay account setup.
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      payouts-enabled: ${RAZORPAYX_PAYOUTS_ENABLED:false}
      payout-account-number: ${RAZORPAYX_ACCOUNT_NUMBER:}
    reconciliation:
      # How far back PaymentReconciliationService looks when comparing our Payment/PayrollRecord
      # rows against Razorpay's own fetch-order/fetch-payout response - see ReconciliationScheduler
      # (daily, 04:00) and POST /platform-admin/reconciliation/run for an on-demand trigger.
      lookback-days: ${PAYMENT_RECONCILIATION_LOOKBACK_DAYS:7}
      max-admins-notified: ${PAYMENT_RECONCILIATION_MAX_ADMINS_NOTIFIED:20}

  bootstrap:
    admin-email: ${PLATFORM_ADMIN_EMAIL:admin@projectx.local}
    admin-password: ${PLATFORM_ADMIN_PASSWORD:changeme123}

  hardware:
    rate-limit:
      # Per-device-id caps for POST /hardware/tap and /hardware/telemetry (see
      # DeviceApiKeyAuthInterceptor/HardwareRateLimiter) - module-hardware, for hardware that does
      # not exist yet in this deployment (see HardwareIngestController's javadoc).
      tap-per-minute: ${HARDWARE_TAP_RATE_LIMIT_PER_MINUTE:60}
      telemetry-per-minute: ${HARDWARE_TELEMETRY_RATE_LIMIT_PER_MINUTE:120}
